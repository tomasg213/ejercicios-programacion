{% extends 'blog/base.html' %}

{% block title %}Registro{% endblock %}

{% block content %}
<h1>Crear Cuenta</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrar</button>
</form>

<p>Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesion</a></p>
{% endblock %}
