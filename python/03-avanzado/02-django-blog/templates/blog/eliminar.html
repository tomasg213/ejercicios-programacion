{% extends 'blog/base.html' %}

{% block title %}Confirmar Eliminacion{% endblock %}

{% block content %}
<h1>Eliminar Post</h1>

<p>Estas seguro de que quieres eliminar "{{ object.titulo }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
</form>

<div style="margin-top: 1rem;">
    <a href="{% url 'detalle_post' object.slug %}">Cancelar</a>
</div>
{% endblock %}
