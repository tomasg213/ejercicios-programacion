{% extends 'blog/base.html' %}

{% block title %}Categorias{% endblock %}

{% block content %}
<h1>Categorias</h1>

<div class="posts">
    {% for categoria in categorias %}
    <div class="post-card">
        <h2><a href="{% url 'categoria' categoria.slug %}">{{ categoria.nombre }}</a></h2>
        <p>{{ categoria.posts.count }} posts</p>
    </div>
    {% empty %}
    <p>No hay categorias.</p>
    {% endfor %}
</div>
{% endblock %}
