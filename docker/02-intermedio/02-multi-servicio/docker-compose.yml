version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - app-network

  frontend:
    image: node:18-alpine
    container_name: frontend-app
    working_dir: /app
    command: sh -c "echo 'Frontend Node.js' && tail -f /dev/null"
    volumes:
      - ./frontend:/app
    networks:
      - app-network

  api:
    image: node:18-alpine
    container_name: api-app
    working_dir: /app
    command: sh -c "echo 'API Node.js' && tail -f /dev/null"
    environment:
      - DATABASE_URL=postgresql://app:secret@db:5432/app
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    volumes:
      - ./api:/app
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis-cache
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
