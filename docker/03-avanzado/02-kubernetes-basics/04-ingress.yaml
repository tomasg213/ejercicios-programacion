apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: miapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mi-app-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress-prod
spec:
  ingressClassName: nginx
  rules:
  - host: miapp.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: mi-app-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mi-app-frontend
            port:
              number: 80
