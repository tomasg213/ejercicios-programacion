<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"> <title>Mi Conversor Pro</title>
</head>
<body>

    <div class="contenedor">
        <h1>Conversor USD</h1>
        
        <input type="number" id="cantidad" placeholder="Monto en USD">
        
        <select id="moneda">
            <option value="EUR">Euros (EUR)</option>
            <option value="MXN">Pesos Mexicanos (MXN)</option>
            <option value="ARS">Pesos Argentinos (ARS)</option>
        </select>
        
        <button id="convertir">Convertir Ahora</button>
        
        <h2 id="resultado">Esperando monto...</h2>
    </div>

    <script src="ConversorDeMonedas.js"></script>
</body>
</html>
