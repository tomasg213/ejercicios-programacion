<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; }
        
        .sidebar { width: 250px; background: #16213e; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-bottom: 20px; font-size: 1.2em; }
        
        .salas { margin-bottom: 20px; }
        .sala { padding: 10px; cursor: pointer; border-radius: 5px; margin-bottom: 5px; }
        .sala:hover, .sala.active { background: #0f3460; }
        
        .usuarios { flex: 1; overflow-y: auto; }
        .usuarios h3 { margin-bottom: 10px; font-size: 0.9em; color: #888; }
        .usuario { padding: 5px 0; font-size: 0.9em; }
        
        .chat { flex: 1; display: flex; flex-direction: column; }
        .header { background: #16213e; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.1em; }
        
        .login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        .login input { padding: 10px; border: none; border-radius: 5px; width: 250px; }
        .login button { padding: 10px 30px; background: #e94560; border: none; border-radius: 5px; color: white; cursor: pointer; }
        .login button:hover { background: #d63850; }
        
        .mensajes { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        .mensajes.active { display: block; }
        
        .mensaje { margin-bottom: 10px; padding: 10px; background: #16213e; border-radius: 10px; }
        .mensaje.sistema { background: transparent; border: 1px dashed #444; font-style: italic; color: #888; }
        .mensaje .meta { font-size: 0.8em; color: #888; margin-bottom: 5px; }
        .mensaje .texto { word-break: break-word; }
        
        .input-area { padding: 15px; background: #16213e; display: none; }
        .input-area.active { display: flex; }
        .input-area input { flex: 1; padding: 10px; border: none; border-radius: 5px; }
        .input-area button { padding: 10px 20px; background: #e94560; border: none; border-radius: 5px; color: white; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Salas</h2>
        <div class="salas" id="salas"></div>
        
        <div class="usuarios">
            <h3>En linea</h3>
            <div id="usuarios"></div>
        </div>
    </div>
    
    <div class="chat">
        <div class="header">
            <h1 id="sala-actual">Chat</h1>
            <span id="estado">Desconectado</span>
        </div>
        
        <div class="login" id="login">
            <h2>Unete al Chat</h2>
            <input type="text" id="usuario" placeholder="Tu nombre">
            <button onclick="unirse()">Entrar</button>
        </div>
        
        <div class="mensajes" id="mensajes"></div>
        
        <div class="input-area" id="input-area">
            <input type="text" id="mensaje" placeholder="Escribe un mensaje...">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let miUsuario = '';
        let miSala = 'general';
        
        socket.on('salas', (salas) => {
            const contenedor = document.getElementById('salas');
            contenedor.innerHTML = '';
            salas.forEach(sala => {
                const div = document.createElement('div');
                div.className = 'sala' + (sala === miSala ? ' active' : '');
                div.textContent = '# ' + sala;
                div.onclick = () => cambiarSala(sala);
                contenedor.appendChild(div);
            });
        });
        
        socket.on('historial', ({ sala, mensajes }) => {
            if (sala === miSala) {
                mostrarMensajes(mensajes);
            }
        });
        
        socket.on('message', (msg) => {
            agregarMensaje(msg);
        });
        
        socket.on('usuarios', (usuarios) => {
            const contenedor = document.getElementById('usuarios');
            contenedor.innerHTML = '';
            usuarios.forEach(usuario => {
                const div = document.createElement('div');
                div.className = 'usuario';
                div.textContent = usuario;
                if (usuario === miUsuario) div.textContent += ' (tu)';
                contenedor.appendChild(div);
            });
        });
        
        socket.on('error', ({ mensaje }) => {
            alert(mensaje);
        });
        
        function unirse() {
            const usuario = document.getElementById('usuario').value.trim();
            if (!usuario) {
                alert('Ingresa tu nombre');
                return;
            }
            
            miUsuario = usuario;
            socket.emit('join', { usuario: miUsuario, sala: miSala });
            
            document.getElementById('login').style.display = 'none';
            document.getElementById('mensajes').classList.add('active');
            document.getElementById('input-area').classList.add('active');
            document.getElementById('estado').textContent = 'Conectado';
            document.getElementById('sala-actual').textContent = '# ' + miSala;
        }
        
        function cambiarSala(sala) {
            if (sala === miSala) return;
            miSala = sala;
            socket.emit('cambiarSala', { sala });
            document.getElementById('sala-actual').textContent = '# ' + sala;
            document.querySelectorAll('.sala').forEach(s => s.classList.remove('active'));
        }
        
        function enviarMensaje() {
            const texto = document.getElementById('mensaje').value.trim();
            if (!texto) return;
            
            socket.emit('message', { sala: miSala, mensaje: texto });
            document.getElementById('mensaje').value = '';
        }
        
        function mostrarMensajes(mensajes) {
            const contenedor = document.getElementById('mensajes');
            contenedor.innerHTML = '';
            mensajes.forEach(msg => crearElementoMensaje(msg, contenedor));
        }
        
        function agregarMensaje(msg) {
            const contenedor = document.getElementById('mensajes');
            crearElementoMensaje(msg, contenedor);
            contenedor.scrollTop = contenedor.scrollHeight;
        }
        
        function crearElementoMensaje(msg, contenedor) {
            const div = document.createElement('div');
            div.className = 'mensaje' + (msg.tipo === 'sistema' ? ' sistema' : '');
            
            if (msg.tipo === 'sistema') {
                div.innerHTML = `<div class="texto">${msg.mensaje}</div>`;
            } else {
                const hora = new Date(msg.timestamp).toLocaleTimeString();
                div.innerHTML = `
                    <div class="meta"><strong>${msg.usuario}</strong> - ${hora}</div>
                    <div class="texto">${msg.mensaje}</div>
                `;
            }
            contenedor.appendChild(div);
        }
        
        document.getElementById('mensaje').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });
    </script>
</body>
</html>
